<g id="Header">
<text x="323" y="126" font-family="Inter" font-size="31" font-weight="700" fill="#1A1C1E" text-anchor="start">Linear Equations</text>
<g id="Badge-FULL">
<rect x="925" y="96" width="118" height="36" rx="18" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
<circle cx="943" cy="114" r="4.5" fill="#1D5C5A" stroke="#1D5C5A" stroke-width="1.5"/>
<circle cx="956" cy="114" r="4.5" fill="#1D5C5A" stroke="#1D5C5A" stroke-width="1.5"/>
<circle cx="969" cy="114" r="4.5" fill="#1D5C5A" stroke="#1D5C5A" stroke-width="1.5"/>
