<text x="323" y="162" font-family="Inter" font-size="14" font-weight="500" fill="#575C63" text-anchor="start">Question 1 of 5</text>
<rect x="323.0" y="174" width="139.2" height="6" rx="3" fill="#1D5C5A"/>
<rect x="468.2" y="174" width="139.2" height="6" rx="3" fill="#DDE0E5"/>
<rect x="613.4" y="174" width="139.2" height="6" rx="3" fill="#DDE0E5"/>
<rect x="758.5999999999999" y="174" width="139.2" height="6" rx="3" fill="#DDE0E5"/>
<rect x="903.8" y="174" width="139.2" height="6" rx="3" fill="#DDE0E5"/>
</g>
<g id="Question-panel">
<rect x="323" y="204" width="720" height="112" rx="8" fill="#EBEDF0"/>
<text x="683" y="272" font-family="Inter" font-size="31" font-weight="600" fill="#1A1C1E" text-anchor="middle">3(x + 4) = x + 20</text>
</g>
<text x="323" y="360" font-family="Inter" font-size="20" font-weight="600" fill="#1A1C1E" text-anchor="start">Worked solution</text>
<g id="Step-1">
<rect x="323" y="380" width="720" height="120" rx="8" fill="#F4F5F7" stroke="#DDE0E5" stroke-width="1"/>
<circle cx="357" cy="412" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
<text x="357" y="417" font-family="Inter" font-size="14" font-weight="700" fill="#1D5C5A" text-anchor="middle">1</text>
<text x="387" y="418" font-family="Inter" font-size="16" font-weight="600" fill="#1A1C1E" text-anchor="start">Distribute the 3</text>
<text x="387" y="452" font-family="Inter" font-size="20" font-weight="400" fill="#575C63" text-anchor="start">3(x + 4) = x + 20</text>
<text x="387" y="482" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">3x + 12 = x + 20</text>
</g>
<g id="Step-2">
<rect x="323" y="512" width="720" height="120" rx="8" fill="#F4F5F7" stroke="#DDE0E5" stroke-width="1"/>
<circle cx="357" cy="544" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
<text x="357" y="549" font-family="Inter" font-size="14" font-weight="700" fill="#1D5C5A" text-anchor="middle">2</text>
<text x="387" y="550" font-family="Inter" font-size="16" font-weight="600" fill="#1A1C1E" text-anchor="start">Group the x terms together (subtract x)</text>
<text x="387" y="584" font-family="Inter" font-size="20" font-weight="400" fill="#575C63" text-anchor="start">3x + 12 = x + 20</text>
<text x="387" y="614" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">2x + 12 = 20</text>
</g>
<g id="Step-3">
<rect x="323" y="644" width="720" height="120" rx="8" fill="#F4F5F7" stroke="#DDE0E5" stroke-width="1"/>
<circle cx="357" cy="676" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
<text x="357" y="681" font-family="Inter" font-size="14" font-weight="700" fill="#1D5C5A" text-anchor="middle">3</text>
<text x="387" y="682" font-family="Inter" font-size="16" font-weight="600" fill="#1A1C1E" text-anchor="start">Undo +12 (subtract 12 from both sides)</text>
<text x="387" y="716" font-family="Inter" font-size="20" font-weight="400" fill="#575C63" text-anchor="start">2x + 12 = 20</text>
<text x="387" y="746" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">2x = 8</text>
</g>
<g id="Step-4">
<rect x="323" y="776" width="720" height="146" rx="8" fill="#F4F5F7" stroke="#DDE0E5" stroke-width="1"/>
<circle cx="357" cy="808" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
<text x="357" y="813" font-family="Inter" font-size="14" font-weight="700" fill="#1D5C5A" text-anchor="middle">4</text>
<text x="387" y="814" font-family="Inter" font-size="16" font-weight="600" fill="#1A1C1E" text-anchor="start">Undo ×2 (divide both sides by 2)</text>
<text x="387" y="848" font-family="Inter" font-size="20" font-weight="400" fill="#575C63" text-anchor="start">2x = 8</text>
<text x="387" y="898" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">x =</text>
<g id="Answer-input">
<rect x="427" y="866" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#575C63" stroke-width="1"/>
<text x="441" y="897" font-family="Inter" font-size="20" font-weight="400" fill="#1A1C1E" text-anchor="start">4</text>
</g>
</g>
<g id="Feedback-correct">
<rect x="323" y="934" width="720" height="120" rx="8" fill="#EEF5F0"/>
<rect x="323" y="934" width="5" height="120" rx="2" fill="#2F6F2F"/>
<circle cx="359" cy="966" r="8" fill="#2F6F2F"/>
<path d="M353 966 L358 971 L366 961" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="381" y="973" font-family="Inter" font-size="20" font-weight="700" fill="#2F6F2F" text-anchor="start">Correct</text>
<text x="351" y="1010" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">x = 4</text>
</g>
