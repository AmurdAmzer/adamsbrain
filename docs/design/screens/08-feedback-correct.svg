<circle cx="536" cy="1088" r="4.5" fill="#1D5C5A" stroke="#1D5C5A" stroke-width="1.5"/>
<circle cx="549" cy="1088" r="4.5" fill="#1D5C5A" stroke="#1D5C5A" stroke-width="1.5"/>
