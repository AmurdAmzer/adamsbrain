<text x="703" y="664" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">2x + 12 = 20</text>
<rect x="343" y="688" width="680" height="1" rx="0" fill="#DDE0E5"/>
<circle cx="357" cy="714" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
