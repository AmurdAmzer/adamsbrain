<text x="387" y="720" font-family="Inter" font-size="16" font-weight="600" fill="#1A1C1E" text-anchor="start">Undo +12</text>
<text x="703" y="720" font-family="Inter" font-size="20" font-weight="500" fill="#1A1C1E" text-anchor="start">2x = 8</text>
<rect x="343" y="744" width="680" height="1" rx="0" fill="#DDE0E5"/>
<circle cx="357" cy="770" r="14" fill="#FFFFFF" stroke="#1D5C5A" stroke-width="1.5"/>
